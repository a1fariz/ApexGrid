# User Service Configuration
server.port=8082

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/apexgrid_db
spring.datasource.username=${DB_USERNAME:apex}
spring.datasource.password=${DB_PASSWORD:apex123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET:apexgrid-super-secret-key-harus-panjang-banget-biar-aman-1234567890}
jwt.expiration=86400000

# Logging
logging.level.com.apexgrid.userservice=DEBUG

# Email (SMTP Gmail)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:mock-email@example.com}
spring.mail.password=${SMTP_PASSWORD:mock-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Set to false to prevent startup failure when email credentials are not configured
spring.mail.test-connection=false

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
