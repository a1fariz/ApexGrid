# User Service Configuration
server.port=8082

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/apexgrid_db
spring.datasource.username=${DB_USERNAME:apex}
spring.datasource.password=${DB_PASSWORD:apex123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# JWT
# M-02 Fix: Added default value for local development to prevent startup crash
jwt.secret=${JWT_SECRET:apexgrid-super-secret-key-for-jwt-2026-development-only}
jwt.expiration=900000

# Logging
logging.level.com.apexgrid.userservice=DEBUG

# Email (SMTP Gmail Setup)
# 1. Ganti SMTP_USERNAME dengan Gmail Anda.
# 2. Ganti SMTP_PASSWORD dengan Gmail App Password (bukan password login biasa).
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Set to false to prevent startup failure when email credentials are not configured
spring.mail.test-connection=false

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Request size limits to prevent OOM / resource exhaustion (10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-swallow-size=10MB
server.tomcat.max-http-form-post-size=10MB
