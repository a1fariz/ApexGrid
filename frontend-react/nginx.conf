server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the API Gateway
    # Using resolver + variable so Nginx re-resolves Docker DNS at runtime
    # instead of crashing if api-gateway restarts and gets a new IP.
    resolver 127.0.0.11 valid=10s;
    set $gateway http://api-gateway:8080;

    location /api {
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Swagger UI docs
    location /swagger-ui {
        proxy_pass $gateway;
    }
    
    location /v3/api-docs {
        proxy_pass $gateway;
    }
}
