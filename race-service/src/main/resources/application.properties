# Race Service Configuration
server.port=8081

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/apexgrid_db
spring.datasource.username=${DB_USERNAME:apex}
spring.datasource.password=${DB_PASSWORD:apex123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Jackson - Serialize dates as UTC so frontend timezone conversion works correctly
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.adjust-dates-to-context-time-zone=true

# JWT (same secret as user-service)
# M-02 Fix: Added default value for local development to prevent startup crash
jwt.secret=${JWT_SECRET:apexgrid-super-secret-key-for-jwt-2026-development-only}

# B-02 Fix: Internal secret — must match api-gateway internal.secret
# IMPORTANT: Set INTERNAL_SECRET env var in production!
internal.secret=${INTERNAL_SECRET:apexgrid-internal-service-secret-2026}

# Email (SMTP Gmail)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:mock-email@example.com}
spring.mail.password=${MAIL_PASSWORD:mock-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Scheduler
scheduler.cancel-booking.cron=0 */5 * * * *

# Logging
logging.level.com.apexgrid.raceservice=DEBUG
logging.file.name=race-service.log

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Request size limits to prevent OOM / resource exhaustion (10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-swallow-size=10MB
server.tomcat.max-http-form-post-size=10MB
