# Race Service Configuration
server.port=8081

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/apexgrid_db
spring.datasource.username=${DB_USERNAME:apex}
spring.datasource.password=${DB_PASSWORD:apex123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT (same secret as user-service)
jwt.secret=${JWT_SECRET:apexgrid-super-secret-key-harus-panjang-banget-biar-aman-1234567890}

# Email (SMTP Gmail)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:mock-email@example.com}
spring.mail.password=${SMTP_PASSWORD:mock-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Scheduler
scheduler.cancel-booking.cron=0 */5 * * * *

# Logging
logging.level.com.apexgrid.raceservice=DEBUG

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
