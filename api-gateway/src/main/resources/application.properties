# API Gateway Configuration
server.port=8080

# Gateway Routes
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=http://localhost:8082
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[1].id=race-service-races
spring.cloud.gateway.routes[1].uri=http://localhost:8081
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/races/**

spring.cloud.gateway.routes[2].id=race-service-bookings
spring.cloud.gateway.routes[2].uri=http://localhost:8081
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/bookings/**

spring.cloud.gateway.routes[3].id=race-service-circuits
spring.cloud.gateway.routes[3].uri=http://localhost:8081
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/circuits/**

spring.cloud.gateway.routes[4].id=race-service-statistics
spring.cloud.gateway.routes[4].uri=http://localhost:8081
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/statistics/**

# Disable default web security
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

# JWT
jwt.secret=apexgrid-super-secret-key-harus-panjang-banget-biar-aman-1234567890

# Logging
logging.level.org.springframework.cloud.gateway=INFO
logging.level.com.apexgrid.gateway=DEBUG
