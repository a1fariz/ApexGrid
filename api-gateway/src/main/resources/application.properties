# API Gateway Configuration
server.port=8080

# Gateway Routes
# B-12 Fix: Explicit CORS instead of wildcard
# In production: change localhost:5173 to your actual domain
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=Authorization,Content-Type,X-Requested-With,Accept
spring.cloud.gateway.globalcors.cors-configurations.[/**].exposed-headers=Authorization
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=${USER_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**,/api/users/**
spring.cloud.gateway.routes[0].filters[0].name=RateLimitFilter

spring.cloud.gateway.routes[1].id=race-service-races
spring.cloud.gateway.routes[1].uri=${RACE_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/races/**

spring.cloud.gateway.routes[2].id=race-service-bookings
spring.cloud.gateway.routes[2].uri=${RACE_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/bookings/**

spring.cloud.gateway.routes[3].id=race-service-circuits
spring.cloud.gateway.routes[3].uri=${RACE_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/circuits/**

spring.cloud.gateway.routes[4].id=race-service-statistics
spring.cloud.gateway.routes[4].uri=${RACE_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/statistics/**

# Disable default web security
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials

# JWT
jwt.secret=${JWT_SECRET:apexgrid-super-secret-key-for-jwt-2026-development-only}

# B-02 Fix: Internal secret shared between gateway and downstream services
# IMPORTANT: Set INTERNAL_SECRET env var in production!
internal.secret=${INTERNAL_SECRET:apexgrid-internal-service-secret-2026}

# Logging
logging.level.org.springframework.cloud.gateway=INFO
logging.level.com.apexgrid.gateway=DEBUG

# WebFlux max in memory size limit (10MB)
spring.codec.max-in-memory-size=10MB

# Gateway timeouts configuration
spring.cloud.gateway.httpclient.connect-timeout=5000
spring.cloud.gateway.httpclient.response-timeout=10s
